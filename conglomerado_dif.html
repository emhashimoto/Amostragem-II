    <div id="animation-container">
        <!-- Os conglomerados serão gerados via JavaScript -->

    <button id="btn-start" onclick="startAnimation()">Iniciar Animação</button>

    <script>
        const container = document.getElementById('animation-container');
        const stepText = document.getElementById('step-text');
        const formulaBox = document.getElementById('formula-box');
        const btnStart = document.getElementById('btn-start');

        // Variáveis do modelo estatístico
        const N = 4; // Número total de conglomerados na população
        const M = 15; // Elementos por conglomerado (M barra)
        const n = 2; // Conglomerados amostrados
        const m = 5; // Elementos amostrados por conglomerado selecionado

        function createClusters() {
            container.innerHTML = '';
            for (let i = 1; i <= N; i++) {
                const clusterDiv = document.createElement('div');
                clusterDiv.className = 'cluster';
                clusterDiv.id = `cluster-${i}`;
                
                const title = document.createElement('div');
                title.className = 'cluster-title';
                title.innerText = `Conglomerado ${i}`;
                clusterDiv.appendChild(title);

                for (let j = 1; j <= M; j++) {
                    const elDiv = document.createElement('div');
                    elDiv.className = 'element';
                    elDiv.id = `el-${i}-${j}`;
                    clusterDiv.appendChild(elDiv);
                }
                container.appendChild(clusterDiv);
            }
        }

        function startAnimation() {
            btnStart.disabled = true;
            createClusters();
            formulaBox.classList.remove('visible');
            formulaBox.innerHTML = '';
                    
            setTimeout(() => {
                // Passo 2: Amostragem dos Conglomerados (Estágio 1)
                //stepText.innerHTML = "Uma amostra aleatória de \\(n\\) conglomerados é selecionada.";
                stepText.innerHTML = "";
                document.getElementById('cluster-1').classList.add('selected');
                document.getElementById('cluster-3').classList.add('selected');
                MathJax.typesetPromise();
            }, 4500);

            setTimeout(() => {
    // Passo 3: Amostragem dos Elementos (Estágio 2)
    //stepText.innerHTML = "É comum retirar amostras de tamanho igual de cada conglomerado, logo \\(m_1 = m_2 = \\dots = m_n = m\\).";
    const selectedClusters = [1, 3];
    
    selectedClusters.forEach(c => {
        // Cria um conjunto para armazenar os índices sorteados sem repetição
        const randomElements = new Set();
        
        // Continua sorteando até ter exatamente 'm' elementos diferentes
        while (randomElements.size < m) {
            const numeroSorteado = Math.floor(Math.random() * M) + 1;
            randomElements.add(numeroSorteado);
        }
        
        // Aplica a classe 'selected' aos elementos sorteados
        randomElements.forEach(j => {
            document.getElementById(`el-${c}-${j}`).classList.add('selected');
        });
    });
    MathJax.typesetPromise();
}, 9000);

            setTimeout(() => {
                // Passo 4: Fórmulas de Estimação
                //stepText.innerHTML = "Sendo \\(y_{ij}\\) a \\(j\\)-ésima medida do \\(i\\)-ésimo conglomerado";
                formulaBox.innerHTML = `
                    Média Estimada:<br><br>
                    \\[ \\hat{\\mu}_{I} = \\frac{1}{n} \\sum_{i=1}^{n} \\overline{y}_i = \\frac{1}{nm} \\sum_{i=1}^{n} \\sum_{j=1}^{m} y_{ij} \\]
                `;
                formulaBox.classList.add('visible');
                MathJax.typesetPromise().then(() => {
                    btnStart.disabled = false;
                    btnStart.innerText = "Reiniciar Animação";
                });
            }, 14000);
        }
        
        // Inicialização
        createClusters();
    </script>

              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
  <script type="application/javascript">
  window.quartoScrollableRegionsLabels = {"code":"Scrollable code","output":"Scrollable output"};
  </script>
