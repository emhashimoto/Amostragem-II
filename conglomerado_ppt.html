    <script>
        const hospitals = [
            { id: 1, patients: 328, rangeStart: 1, rangeEnd: 328, colorClass: 'h-color-1', tailwindColor: 'text-blue-500' },
            { id: 2, patients: 109, rangeStart: 329, rangeEnd: 437, colorClass: 'h-color-2', tailwindColor: 'text-emerald-500' },
            { id: 3, patients: 432, rangeStart: 438, rangeEnd: 869, colorClass: 'h-color-3', tailwindColor: 'text-yellow-500' },
            { id: 4, patients: 220, rangeStart: 870, rangeEnd: 1089, colorClass: 'h-color-4', tailwindColor: 'text-red-500' },
            { id: 5, patients: 280, rangeStart: 1090, rangeEnd: 1369, colorClass: 'h-color-5', tailwindColor: 'text-purple-500' },
            { id: 6, patients: 190, rangeStart: 1370, rangeEnd: 1559, colorClass: 'h-color-6', tailwindColor: 'text-orange-500' }
        ];

        const TOTAL_PATIENTS = 1559;
        const NUM_DRAWS = 3;
        
        // Elementos do DOM
        const tableBody = document.querySelector('#hospital-table tbody');
        const pptBar = document.getElementById('ppt-bar');
        const markersArea = document.getElementById('markers-area');
        const drawBtn = document.getElementById('draw-btn');
        const resultsContainer = document.getElementById('results-container');
        const resultsList = document.getElementById('results-list');

        // Navigation elements
        const page1 = document.getElementById('page-1');
        const page2 = document.getElementById('page-2');
        const btnNext = document.getElementById('btn-next');
        const btnBack = document.getElementById('btn-back');

        // Page Switch Logic
        function switchPage(hidePage, showPage) {
            hidePage.classList.remove('opacity-100');
            hidePage.classList.add('opacity-0');
            
            setTimeout(() => {
                hidePage.classList.add('hidden');
                showPage.classList.remove('hidden');
                
                // Force a browser reflow to allow the transition to play
                void showPage.offsetWidth;
                
                showPage.classList.remove('opacity-0');
                showPage.classList.add('opacity-100');
            }, 300);
        }

        btnNext.addEventListener('click', () => switchPage(page1, page2));
        btnBack.addEventListener('click', () => switchPage(page2, page1));

        // Inicialização
        function init() {
            renderTable();
            renderBar();
        }

        // Renderizar Tabela
        function renderTable() {
            tableBody.innerHTML = '';
            hospitals.forEach(h => {
                const tr = document.createElement('tr');
                tr.id = `row-h${h.id}`;
                tr.className = "hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-3">
                        <div class="w-4 h-4 rounded-full ${h.colorClass} shadow-sm"></div>
                    </td>
                    <td class="px-4 py-3 font-medium text-gray-700">Hospital ${h.id}</td>
                    <td class="px-4 py-3 text-right font-mono">${h.patients}</td>
                    <td class="px-4 py-3 text-right font-mono text-gray-500">${h.rangeStart}-${h.rangeEnd}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Renderizar Barra Proporcional
        function renderBar() {
            pptBar.innerHTML = '';
            hospitals.forEach(h => {
                const widthPercentage = (h.patients / TOTAL_PATIENTS) * 100;
                const segment = document.createElement('div');
                segment.className = `bar-segment ${h.colorClass}`;
                segment.style.width = `${widthPercentage}%`;
                segment.title = `Hospital ${h.id}: ${h.patients} pacientes (${widthPercentage.toFixed(1)}%)`;
                
                // Só mostrar texto se houver espaço
                if (widthPercentage > 8) {
                    segment.innerText = `H${h.id}`;
                }
                
                pptBar.appendChild(segment);
            });
        }

        // Determinar qual hospital corresponde ao número sorteado
        function getSelectedHospital(randomNumber) {
            return hospitals.find(h => randomNumber >= h.rangeStart && randomNumber <= h.rangeEnd);
        }

        // Ação de Sorteio
        drawBtn.addEventListener('click', () => {
            // Prevenir cliques múltiplos
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
            drawBtn.innerText = "Sorteando...";

            // Limpar estados anteriores
            markersArea.innerHTML = '';
            resultsList.innerHTML = '';
            resultsContainer.classList.add('hidden');
            resultsContainer.classList.remove('opacity-100');
            hospitals.forEach(h => {
                const row = document.getElementById(`row-h${h.id}`);
                row.classList.remove('row-highlight');
                row.classList.remove('bg-yellow-50');
            });

            const draws = [];
            
            // Lógica de Sorteio
            let currentDrawIndex = 0;

            function executeNextDraw() {
                if (currentDrawIndex < NUM_DRAWS) {
                    // Sorteia entre 1 e TOTAL_PATIENTS
                    const randNum = Math.floor(Math.random() * TOTAL_PATIENTS) + 1;
                    const selectedHosp = getSelectedHospital(randNum);
                    
                    draws.push({ number: randNum, hospital: selectedHosp });
                    
                    animateDraw(randNum, selectedHosp, currentDrawIndex + 1);
                    
                    currentDrawIndex++;
                    // Atraso entre os sorteios para efeito visual
                    setTimeout(executeNextDraw, 1200); 
                } else {
                    // Fim dos sorteios
                    setTimeout(() => {
                        showResults(draws);
                        drawBtn.disabled = false;
                        drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        drawBtn.innerText = "Realizar Novo Sorteio";
                    }, 500);
                }
            }

            executeNextDraw();
        });

        // Animação de cada marcador
        function animateDraw(number, hospital, drawOrder) {
            // Calcular posição (em %)
            const positionPercent = (number / TOTAL_PATIENTS) * 100;

            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.style.left = `${positionPercent}%`;
            marker.innerHTML = `
                <div class="marker-number">#${number}</div>
                <div class="marker-arrow"></div>
            `;
            
            markersArea.appendChild(marker);

            // Reflow para ativar a transição CSS
            void marker.offsetWidth;
            
            // Inicia a animação caindo
            marker.classList.add('show');

            // Destacar na tabela (breve delay para sincronizar com a seta caindo)
            setTimeout(() => {
                const row = document.getElementById(`row-h${hospital.id}`);
                row.classList.add('row-highlight', 'bg-yellow-50');
            }, 300);
        }

        // Mostrar Lista de Resultados
        function showResults(draws) {
            resultsContainer.classList.remove('hidden');
            // Reflow
            void resultsContainer.offsetWidth;
            resultsContainer.classList.add('opacity-100');

            draws.forEach((draw, index) => {
                const li = document.createElement('li');
                li.className = "flex items-center bg-white p-3 rounded shadow-sm border border-gray-100 transition-all hover:shadow-md";
                li.innerHTML = `
                    <div class="bg-gray-800 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold mr-4 shrink-0 shadow">
                        ${index + 1}
                    </div>
                    <div class="flex-grow">
                        <span class="text-sm text-gray-500 block">Número Sorteado: <strong class="text-gray-800">${draw.number}</strong></span>
                        <span class="text-base font-semibold">Caiu no intervalo do <span class="${draw.hospital.tailwindColor}">Hospital ${draw.hospital.id}</span></span>
                    </div>
                    <div class="${draw.hospital.colorClass} w-3 h-10 rounded-sm ml-4 shadow-inner"></div>
                `;
                resultsList.appendChild(li);
            });
        }

        // Iniciar
        window.onload = init;
    </script>

          const placeBand = (band, firstEl, lastEl, codeBlock) => {
            const container = band.offsetParent;
            if (container === null) {
              return;
            }
            const containerRect = container.getBoundingClientRect();
            // Reveal.js scales slides with a transform, so convert client

            const scale = containerRect.height / container.offsetHeight || 1;
            const firstRect = firstEl.getBoundingClientRect();

            const top = (firstRect.top - containerRect.top) / scale - container.clientTop + container.scrollTop;
            const height = (lastRect.bottom - firstRect.top) / scale;
            band.style.top = top - 2 + "px";
            band.style.height = height + 4 + "px";
            if (codeBlock) {
              // Without the copy button wrapper, the containing block is wider
              // than the code block, so span the code block explicitly.
              const blockRect = codeBlock.getBoundingClientRect();
              band.style.left = (blockRect.left - containerRect.left) / scale - container.clientLeft + container.scrollLeft + "px";
              band.style.width = blockRect.width / scale + "px";
            }
